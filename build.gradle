plugins {
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.akasyaduragi'
archivesBaseName = 'akasyaduragi'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.21'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21-26.2'
}

tasks.register('modProperties') {
    ext.displayName = "Akasya Durağı Bir: Trakya'da Tek Başına"
}
